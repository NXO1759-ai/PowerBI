<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Overview — KBLB</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <!-- ============================ header strip ============================ -->
    <header class="card header">
      <div class="header-left">
        <h1 id="company-name">—</h1>
        <div class="header-sub" id="header-sub">—</div>
        <div class="search-box">
          <input type="search" id="company-search"
                 placeholder="Search ticker, CIK, or company name…"
                 autocomplete="off" />
          <button type="button" class="search-btn" id="search-btn"
                  title="Search companies">Search</button>
          <div class="search-results" id="search-results"></div>
        </div>
      </div>
      <div class="header-stats" id="header-stats"><!-- filled by app.js --></div>
      <div class="header-facts" id="header-facts"><!-- filled by app.js --></div>
    </header>

    <!-- ============================ charts row ============================== -->
    <section class="charts-row">
      <div class="charts-col">
        <div class="card chart-panel">
          <h2>30 Day History</h2>
          <div class="chart-body" id="chart-30d-wrap">
            <canvas id="chart-30d"></canvas>
          </div>
        </div>
        <div class="card chart-panel">
          <h2>6 Month History</h2>
          <div class="chart-body" id="chart-6m-wrap">
            <canvas id="chart-6m"></canvas>
          </div>
        </div>
      </div>
      <div class="card analyst-panel">
        <h2>Analyst Opinion &amp; News</h2>
        <div class="analyst-body" id="analyst-body"><!-- filled by app.js --></div>
      </div>
    </section>

    <!-- ========================== three columns ============================= -->
    <section class="columns">

      <!-- column 1: company information -->
      <div class="card col">
        <h2>Company Information</h2>
        <div id="company-info"><!-- filled by app.js --></div>
      </div>

      <!-- column 2: fundamental analysis -->
      <div class="card col">
        <div class="col-head">
          <h2>Fundamental Analysis</h2>
          <label class="pct-toggle" title="Show % change vs comparison period">
            <input type="checkbox" id="pct-toggle" /> % change
          </label>
        </div>

        <h3 class="table-title">Burn Rate</h3>
        <table class="grid" id="tbl-burn">
          <thead></thead><tbody></tbody>
        </table>

        <h3 class="table-title">Balance Sheet</h3>
        <table class="grid" id="tbl-bs">
          <thead></thead><tbody></tbody>
        </table>

        <h3 class="table-title">Income Statement</h3>
        <table class="grid" id="tbl-is">
          <thead></thead><tbody></tbody>
        </table>

        <h3 class="table-title">Cash Flow <span class="hint">(single quarter)</span></h3>
        <table class="grid" id="tbl-cf">
          <thead></thead><tbody></tbody>
        </table>
      </div>

      <!-- column 3: volume & shares -->
      <div class="col-stack">
        <div class="card col">
          <h2>Volume Statistics</h2>
          <h3 class="table-title">Volume Stats</h3>
          <table class="grid" id="tbl-vol">
            <thead></thead><tbody></tbody>
          </table>
          <h3 class="table-title">Value Stats (US$)</h3>
          <table class="grid" id="tbl-val">
            <thead></thead><tbody></tbody>
          </table>
          <h3 class="table-title">Days to Liquidate
            <span class="hint">(% of avg daily value)</span></h3>
          <div id="liq-tables"></div>
        </div>
        <div class="card col">
          <h2>Share Information</h2>
          <table class="grid" id="tbl-shares">
            <thead></thead><tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <footer id="footer">—</footer>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="data/company-kblb.js"></script>
  <script src="app.js"></script>
</body>
</html>
