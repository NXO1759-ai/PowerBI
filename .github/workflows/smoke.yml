name: Smoke — awkward companies against every endpoint

# Runs the real serverless handlers in-process against the companies
# that break naive code (a new listing, a bank, a property trust, an IFRS
# filer, a shell) plus one control, before a change can merge. The
# weekly parity check compares builder output; this exercises the live
# API paths, ratio layer included.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend scripts parse
        run: |
          for f in frontend/*.js frontend/lib/*.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "parse failure: $f"; exit 1; }
          done

      - name: Valuation library against the course's worked figures
        run: node scripts/test-valuation.mjs

      - name: Untagged interim reports against a real 6-K exhibit
        run: node scripts/test-interim.mjs

      - name: FRED reader against real downloads
        run: node scripts/test-fred.mjs

      - name: Monthly price history against a real Yahoo reply
        run: node scripts/test-price-history.mjs

      - name: Glossary terms, the generator and the hover wrapper
        run: node scripts/test-credit-terms.mjs

      - name: Navigation on four pages and the credit captions
        run: node scripts/test-nav.mjs

      - name: Owner-tools rebuild control (secret storage, request shape, polling; force refresh, PR G)
        run: node scripts/test-owner-tools.mjs

      - name: BDC series builder against ARCC and PSEC fixtures
        run: node scripts/test-bdc-series.mjs

      - name: Live one-BDC force refresh against SEC EDGAR (force refresh, PR G)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/test-bdc-pull.mjs

      - name: Credit formulas against BXSL and MAIN pins
        run: node scripts/test-credit-ratios.mjs

      - name: BDC data files
        run: node scripts/test-bdc-data.mjs

      # The PitchBook and LCD ingest: readers, period grammar, hand-keyed
      # reports and the mapping and replay, all against the committed
      # fixture cuts (the raw downloads are not in the repository).
      - name: LCD monitor deck reader against the six-slide cut
        run: node scripts/test-pc-deck.mjs

      - name: Fund Overview workbook reader against the four-sheet cut
        run: node scripts/test-pc-workbook.mjs

      - name: Period grammar on every deck and workbook label
        run: node scripts/test-pc-periods.mjs

      - name: Hand-keyed report series and the press series
        run: node scripts/test-pc-reports.mjs

      - name: Chart mapping, vintage replay and the ingest end to end
        run: node scripts/test-pc-ingest.mjs

      # The Market view's page layer over the ingested series: the loader
      # against the committed files, the catalog registry, the composite
      # view, the html and the note endpoint, and every section file's
      # registration and caption widths under a window stub.
      - name: Private credit page layer, sections and captions
        run: node scripts/test-pc-page.mjs

      # The Underwriting view's page controller (blueprint section 5, PR F):
      # evaluated in credit.html's own script order so a catalog-key
      # collision with the Market view's section files would fail here;
      # a stubbed fetch of a company slice drives selection through U1-U4
      # and the six-card scorecard offline.
      - name: Underwriting view - bands, ladder, runway, headroom
        run: node scripts/test-underwriting-view.mjs

      # The Underwriting concept ladder (blueprint section 5, PR F): the
      # maturity ladder, revolver capacity and pure-unit cost-of-debt reader
      # against the AT&T, NVIDIA and RTX companyfacts fixtures.
      - name: Underwriting concepts - maturity ladder, revolver, cost of debt
        run: node scripts/test-underwriting-concepts.mjs

      # The Underwriting weekly panel's buildRow() scoring (blueprint
      # section 5, PR F), offline against the same three fixtures.
      - name: Underwriting panel - S&P bands, headroom, liquidity runway
        run: node scripts/test-underwriting-panel.mjs

      # PR D, the Lenders view: the scorecard (frontend/lib/lenders-
      # scorecard.js), the per-BDC drill-down (frontend/credit-lenders-
      # drilldown.js), the BDC-distance peer selection (frontend/lib/
      # valuation.js) and the view's own controller (frontend/credit-
      # lenders.js — the composite strip, dispersion dots, peers panel,
      # fetch/caching strategy and page-level error state). All four are
      # offline, against the real committed frontend/data/bdc files.
      - name: Lenders view - scorecard, drilldown, peers
        run: |
          node scripts/test-lenders-scorecard.mjs
          node scripts/test-lenders-drilldown.mjs
          node scripts/test-bdc-peers.mjs
          node scripts/test-lenders-view.mjs

      - name: Feed durations and labels against Amazon, Microsoft and Oracle slices
        run: node scripts/test-feed-durations.mjs

      - name: Build-out monitor concepts against the cohort slices
        run: node scripts/test-hs-concepts.mjs

      - name: Capex panel builder against the PR H2 acceptance figures
        run: node scripts/test-capex-panel.mjs

      - name: Build-out view - capex, funding, debt
        run: node scripts/test-buildout-view.mjs

      - name: Build-out ledgers - deal timeline, ratings, private-credit ties
        run: node scripts/test-buildout-ledgers.mjs

      - name: Ledger row schema and exclusion rules (URLs, Hyperion/El Paso dedupe)
        run: node scripts/test-ledgers.mjs

      - name: Derived 15.8 series - FX arithmetic against live FRED rates
        run: node scripts/test-ledger-series.mjs

      - name: Nebius interim reports against the hand-keyed table
        run: node scripts/test-nbis-interims.mjs

      # The schedule-of-investments readers against verbatim fixture
      # cuts (the SEC data set, a filing instance, the 10-Q table and
      # the rendered R page, the 10-Q prose), then the committed holdings
      # and composite files against the PR C acceptance list. All four
      # are offline.
      - name: Schedule readers against the SEC data set and a filing instance
        run: node scripts/test-soi.mjs

      - name: Schedule readers against the 10-Q table and the R page
        run: node scripts/test-soi-html.mjs

      - name: Prose extractor against 10-Q cuts
        run: node scripts/test-bdc-prose.mjs

      - name: BDC holdings and composite files
        run: node scripts/test-bdc-holdings.mjs

      - name: API replies are read without leaking a parser error
        run: node scripts/test-http.mjs

      - name: Owner rebuild dispatch/poll endpoint (503/401/409/202 gates; force refresh, PR G)
        run: node scripts/test-rebuild.mjs

      - name: Endpoints against awkward companies
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/smoke.mjs
