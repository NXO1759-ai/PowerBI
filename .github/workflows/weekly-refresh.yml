name: Weekly data refresh

# Sunday 07:00 UTC — after the week's filings have settled and before the
# Monday open. The local MySQL is unreachable from Actions, so this pulls
# SEC EDGAR directly and commits the result; Vercel deploys on the push.
# The run also writes sql/sync/facts-<date>.sql, which is what brings the
# local database and Power BI back in step with what the site is serving.
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only refresh the first N companies (0 = all)"
        required: false
        default: "0"
      layer:
        # Blueprint 7.6 names a third option, "pc" — deliberately not
        # offered here yet: the PitchBook/LCD ingest (7.5) has no step in
        # this workflow at all, it runs on the owner's own machine
        # (data-sources/README.md, .github/workflows/ingest-pc.yml), so a
        # "pc" layer would have nothing here to select. Add it back once
        # that ingest gains a step in this workflow.
        description: >-
          Which layers to refresh. "all" runs everything; "bdc" skips the
          operating-company steps (Refresh fundamentals, Verify metric
          parity, Rebuild segment data, Rebuild the risk registers,
          Rebuild the strategy panel) and only touches the listed-BDC
          layer, the cache, chunking and the commit.
        required: false
        default: "all"
        type: choice
        options:
          - all
          - bdc

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # These five steps are the operating-company layer. A scheduled run
      # carries no inputs at all — `inputs.layer` is then null, which the
      # expression below coerces to "" for the comparison — so the
      # condition is written as "run unless layer is exactly bdc" rather
      # than "run when layer is exactly all": null, "", "all" and any
      # value this workflow does not recognize all take the safe branch
      # and run the full refresh; only an explicit "bdc" skips it.
      #
      # No dependencies to install: refresh.mjs and metrics.js are plain
      # JavaScript on the standard library.
      - name: Refresh fundamentals from SEC EDGAR
        id: refresh
        if: ${{ inputs.layer != 'bdc' }}
        env:
          # SEC throttles traffic without a real contact address.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/refresh.mjs --limit ${{ github.event.inputs.limit || 0 }}

      - name: Verify metric parity between JavaScript and SQL
        if: ${{ inputs.layer != 'bdc' }}
        run: node scripts/verify-parity.mjs

      # Segment, product and geographic revenue come from each filing
      # itself rather than the companyfacts feed, so a fresh 10-K shows
      # up here the week after it is filed.
      - name: Rebuild segment data from annual filings
        if: ${{ inputs.layer != 'bdc' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/build-segments.mjs

      - name: Rebuild the risk registers from annual filings
        if: ${{ inputs.layer != 'bdc' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/build-risks.mjs

      - name: Rebuild the strategy panel
        if: ${{ inputs.layer != 'bdc' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/build-strategy-panel.mjs

      # The listed BDCs: universe, quarterly series and coverage under
      # frontend/data/bdc/, which the commit below already picks up. The
      # script exits 1 only when it wrote nothing; even then the
      # operating-company refresh above is committed, and the BDC files
      # keep last week's, since an EDGAR hiccup here is not a reason to
      # discard the rest of the run. The smoke suite's test-bdc-data.mjs
      # holds the committed files to the acceptance list on the push.
      # The holdings stage streams the SEC's monthly BDC data-set zips
      # (2-270 MB each) into .cache/bdc/datasets/ and re-downloads one
      # only when the SEC's copy changed, so the zips are kept between
      # runs: every run saves its own entry and the next restores the
      # newest. The 10-Q main documents are fetched once per new
      # accession and are not cached here. A week without a new filing
      # downloads nothing either way. The newest entry can sit just past
      # GitHub's seven-day unused-cache eviction when the Sunday cron
      # drifts, so a miss is expected now and then: it costs one 266 MB
      # download, never correctness.
      - name: Keep the SEC data-set zips between runs
        uses: actions/cache@v4
        with:
          path: .cache/bdc/datasets
          key: bdc-datasets-${{ github.run_id }}
          restore-keys: |
            bdc-datasets-

      # Its own timeout, inside the job's 45 minutes: a stalled zip
      # download (ten minutes an attempt, one retry, in refresh-bdc.mjs)
      # ends this step alone, and continue-on-error lets the commit step
      # keep the operating-company refresh above.
      - name: Refresh the BDC layer
        continue-on-error: true
        timeout-minutes: 25
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/refresh-bdc.mjs

      # The Underwriting view (blueprint section 5, PR F): the same 137
      # covered tickers read as a lender would read them, off the same
      # companyfacts feed the strategy panel above already pulls. It exits
      # 1 only when every single row came back null (a wholesale EDGAR
      # outage), never for one filer's own gap, so continue-on-error keeps
      # the rest of this run's commit either way.
      - name: Refresh the underwriting panel
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/build-underwriting-panel.mjs
      # The hyperscaler and neocloud build-out monitor (blueprint section
      # 15, PR H2): frontend/data/capex/{hyperscalers,neoclouds,landlords}.json
      # for the 13 filers of frontend/data/cohorts.json. Its own
      # companyfacts pulls are paced and independent of the layers above,
      # and writeIfChanged already keeps an unchanged week byte-identical,
      # so an EDGAR hiccup here is no reason to discard the rest of the
      # run, the same as the BDC layer above.
      - name: Refresh the build-out capex panel
        if: ${{ inputs.layer != 'bdc' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Research Terminal research@chineduokeke.mba' }}
        run: node scripts/build-capex-panel.mjs

      # The pages fetch the panel by industry and segments and risks by
      # company, so the monolithic files are split after every rebuild.
      - name: Chunk the data files for lazy loading
        run: node scripts/chunk-data.mjs

      # frontend/data/quality-report.json is written only by the
      # operating-company steps above, which a layer:bdc run skips
      # entirely — reading it unconditionally on a bdc-only run would
      # pick up the committed copy from the PREVIOUS full run and report
      # that run's numbers for one that refreshed no companies at all.
      - name: Summarise the run
        if: always()
        env:
          LAYER: ${{ inputs.layer || 'all' }}
        run: |
          if [ "$LAYER" = "bdc" ]; then
            if [ -f frontend/data/bdc/refresh-report.json ]; then
              node -e "
                const r = require('./frontend/data/bdc/refresh-report.json');
                const line = (s) => process.stdout.write(s + '\n');
                line('## Weekly refresh — BDC layer only');
                line('');
                line('| | |');
                line('|---|---|');
                line('| BDC companies written | ' + r.companiesWritten + ' / ' + r.companiesAttempted + ' |');
                line('| Errors | ' + r.errorCount + ' |');
                line('| Warnings | ' + r.warnCount + ' |');
              " >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -f frontend/data/quality-report.json ]; then
            node -e "
              const r = require('./frontend/data/quality-report.json');
              const line = (s) => process.stdout.write(s + '\n');
              line('## Weekly refresh');
              line('');
              line('| | |');
              line('|---|---|');
              line('| Companies written | ' + r.companiesWritten + ' / ' + r.companiesAttempted + ' |');
              line('| Errors | ' + r.errorCount + ' |');
              line('| Warnings | ' + r.warnCount + ' |');
              line('| Duration | ' + r.durationSeconds + 's |');
              if (r.companiesFailed.length) {
                line('');
                line('### Skipped');
                r.companiesFailed.slice(0, 25).forEach(f =>
                  line('- **' + f.ticker + '** — ' + f.reason));
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed data
        env:
          LAYER: ${{ inputs.layer || 'all' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data sql/sync
          if git diff --cached --quiet; then
            echo "No changes — filings unchanged since the last run."
            exit 0
          fi
          # Every deletion this commit would carry is printed first, so a
          # file that vanished (a BDC that left the universe, or a script
          # that emptied a directory) is visible in the log and never a
          # silent line in a data commit.
          DELETED=$(git diff --cached --name-status | grep '^D' || true)
          if [ -n "$DELETED" ]; then
            echo "Staged deletions:"
            echo "$DELETED"
          fi
          # On a bdc-only run, frontend/data/quality-report.json was never
          # rewritten this run — reading it here would report the
          # PREVIOUS full run's operating-company count against a commit
          # that refreshed none. The subject line says which layer ran
          # instead of a number this run did not produce.
          if [ "$LAYER" = "bdc" ]; then
            SUBJECT="chore(data): weekly refresh — BDC layer only"
          else
            WRITTEN=$(node -p "require('./frontend/data/quality-report.json').companiesWritten")
            SUBJECT="chore(data): weekly refresh — ${WRITTEN} companies from SEC EDGAR"
          fi
          git commit -m "$SUBJECT

          Generated by .github/workflows/weekly-refresh.yml.
          Apply sql/sync/facts-*.sql to bring finance_db and Power BI in step."
          # A run dispatched from the site can finish while a pull request
          # merges, so rebase onto main as it is now and push; one retry
          # covers a merge that lands between the rebase and the push.
          git pull --rebase origin main
          git push || { git pull --rebase origin main && git push; }

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: frontend/data/quality-report.json
          if-no-files-found: warn

      # Proves the production deployment still serves only the site:
      # the scripts, SQL, docs and workflows answer 404 and a page, a
      # function and a data file still answer. The push above triggers a
      # new deploy that may still be building, so this reads the one
      # already live; a failure is reported, never allowed to undo the
      # data commit.
      - name: Check the site serves only the site
        if: always()
        continue-on-error: true
        run: node scripts/check-exposure.mjs
